project:
  title:        "Protocol Emulator"
  author:       "Tyler Hayworth"
  discord:      ""
  description:  "Programmable pin-timing CPU that runs UART, SPI and I2C as firmware"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "6x4"
  top_module:  "tt_um_<yourgithub>_protoemu"
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  ui[0]: "host_data0"
  ui[1]: "host_data1"
  ui[2]: "host_data2"
  ui[3]: "host_data3"
  ui[4]: "host_cmd0"
  ui[5]: "host_cmd1"
  ui[6]: "host_strobe"
  ui[7]: "run"
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "out4"
  uo[5]: "out5"
  uo[6]: "out6"
  uo[7]: "busy"
  uio[0]: "pin0"
  uio[1]: "pin1"
  uio[2]: "pin2"
  uio[3]: "pin3"
  uio[4]: "pin4"
  uio[5]: "pin5"
  uio[6]: "pin6"
  uio[7]: "pin7"

# Do not change!
yaml_version: 6
